<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服系統｜基準狀態（無人設對照組）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0f2;
    --chat-bg: #ffffff;
    --border: #e2e4e8;
    --timestamp: #9aa3af;
    --accent: #6B7280;
    --bubble-bg: #F1F2F4;
    --header-bg: #24272B;
    --text-on-bubble: #2E3238;
    --font-main: 'Noto Sans TC', sans-serif;
    --font-ui: 'DM Sans', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-main);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 24px 20px 40px;
    gap: 12px;
  }

  .label-bar {
    width: 400px; max-width: 100%;
    font-family: var(--font-ui); font-size: 12px; color: #9aa3af;
    text-align: center; letter-spacing: 0.3px; line-height: 1.6;
  }
  .label-bar b { color: var(--accent); }

  .chat-wrapper {
    width: 400px; height: 660px; display: flex; flex-direction: column;
    border-radius: 12px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    background: var(--chat-bg); border: 1px solid var(--border);
  }

  /* Header — 純文字，無頭像、無暱稱 */
  .chat-header {
    padding: 16px 20px; flex-shrink: 0; background: var(--header-bg);
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title { color: #fff; font-family: var(--font-ui); font-weight: 700; font-size: 14px; letter-spacing: 0.3px; }
  .header-status { color: #9aa8b0; font-size: 11.5px; font-family: var(--font-ui); }
  .header-icon { color: rgba(255,255,255,0.4); cursor: pointer; font-size: 16px; }

  /* Chat body */
  .chat-body { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
  .chat-body::-webkit-scrollbar { width: 4px; }
  .chat-body::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 4px; }

  .date-divider { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .date-divider::before, .date-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .date-divider span { font-size: 11px; color: var(--timestamp); font-family: var(--font-ui); }

  /* 純文字訊息列：無頭像，僅以對齊方向與底色區分角色 */
  .msg-row { display: flex; flex-direction: column; animation: fadeIn 0.2s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .msg-row.user { align-items: flex-end; }
  .msg-row.sys  { align-items: flex-start; }

  .sender-label { font-size: 10.5px; color: #b0b6bd; font-family: var(--font-ui); margin: 0 2px 3px; letter-spacing: 0.4px; }

  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 6px; font-size: 14px;
    line-height: 1.6; word-break: break-word;
  }
  .bubble.sys  { background: var(--bubble-bg); color: var(--text-on-bubble); border: 1px solid #E4E6E9; }
  .bubble.user { background: #1a1a2e; color: #fff; border-radius: 6px; }

  .highlight { font-weight: 700; color: var(--accent); }
  .timestamp { font-size: 10.5px; color: var(--timestamp); font-family: var(--font-ui); margin-top: 3px; padding: 0 2px; }

  /* ══════════════════════════════
     功能性載入回饋：進度條（非擬人化，取代打字動畫／表情）
  ══════════════════════════════ */
  .progress-row { max-width: 78%; }
  .progress-bubble {
    background: var(--bubble-bg); border: 1px solid #E4E6E9; border-radius: 6px;
    padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 140px;
  }
  .progress-label { font-size: 11.5px; color: #6b7280; font-family: var(--font-ui); }
  .progress-track { width: 100%; height: 5px; background: #E2E4E8; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width 0.1s linear; }

  .quick-replies { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .qr-btn {
    font-family: var(--font-main); font-size: 13px; padding: 7px 14px; border-radius: 4px;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    cursor: pointer; transition: all 0.15s; font-weight: 500;
  }
  .qr-btn:hover { background: var(--accent); color: #fff; }
  .qr-btn:disabled { opacity: 0.4; cursor: default; }

  /* Footer */
  .chat-footer { background: #fff; border-top: 1px solid var(--border); padding: 12px 16px; flex-shrink: 0; }
  .input-row { display: flex; align-items: center; gap: 8px; background: #f6f7f9; border-radius: 6px; padding: 8px 8px 8px 14px; border: 1px solid transparent; transition: border-color 0.2s; }
  .input-row:focus-within { border-color: var(--accent); background: #fff; }
  .chat-input { flex: 1; border: none; background: transparent; font-family: var(--font-main); font-size: 14px; color: #1a1a2e; outline: none; resize: none; height: 22px; line-height: 22px; max-height: 80px; }
  .chat-input::placeholder { color: #adb5bd; }
  .send-btn {
    padding: 7px 14px; border: none; cursor: pointer; border-radius: 4px;
    background: var(--accent); color: #fff; font-size: 13px; font-family: var(--font-ui); font-weight: 600;
  }
  .send-btn:hover { opacity: 0.9; }
  .footer-hint { text-align: center; font-size: 10.5px; color: #b0b6bd; margin-top: 6px; font-family: var(--font-ui); }
</style>
</head>
<body>

<div class="label-bar"><b>基準狀態（對照組）</b> — 純文字介面／系統圖示或無頭像／功能性進度條取代載入與表情動畫</div>

<div class="chat-wrapper">
  <div class="chat-header">
    <div>
      <div class="header-title">客服系統</div>
      <div class="header-status">系統運作中</div>
    </div>
    <span class="header-icon">✕</span>
  </div>

  <div class="chat-body" id="chatBody"></div>

  <div class="chat-footer">
    <div class="input-row">
      <textarea class="chat-input" id="chatInput" placeholder="輸入訊息…" rows="1"
        onkeydown="handleEnter(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMessage()">送出</button>
    </div>
    <div class="footer-hint">回覆由系統自動處理</div>
  </div>
</div>

<script>
  // ══════════════════════════════
  //  對話流程圖（與 Scenario 2 相同節點結構，文字改為系統／功能性語氣，無暱稱無情緒）
  // ══════════════════════════════
  const FLOW = {
    start: {
      text: '系統偵測到您的包裹到貨後可能有異常，請確認以下狀況：',
      options: [
        { label: '收到的顏色/款式送錯了', next: 'wrong_item' },
        { label: '品項有漏送', next: 'missing_item' },
        { label: '包裝或商品有損壞', next: 'damaged_item' },
        { label: '我先看看，稍後再說', next: 'closing' }
      ]
    },
    wrong_item: {
      text: '請提供訂單編號，並說明實際收到與訂購商品的差異（顏色／款式）。',
      options: [
        { label: '申請換貨', next: 'exchange_process' },
        { label: '申請退款', next: 'refund_process' },
        { label: '上傳照片協助核對', next: 'upload_photo' },
        { label: '返回主選單', next: 'main_menu' }
      ]
    },
    missing_item: {
      text: '請說明缺少的品項名稱，系統將安排補寄或退款處理。',
      options: [
        { label: '補寄遺漏品項', next: 'resend_item' },
        { label: '退還遺漏品項費用', next: 'refund_process' },
        { label: '返回主選單', next: 'main_menu' }
      ]
    },
    damaged_item: {
      text: '請上傳商品損壞照片，以利進行換貨處理。',
      options: [
        { label: '上傳照片協助核對', next: 'upload_photo' },
        { label: '直接申請換貨', next: 'exchange_process' },
        { label: '返回主選單', next: 'main_menu' }
      ]
    },
    upload_photo: {
      text: '照片已收到。審核將於 24 小時內完成，結果將另行通知。',
      options: [
        { label: '查詢處理進度', next: 'order_status' },
        { label: '還有其他問題', next: 'main_menu' },
        { label: '不需要協助了', next: 'closing' }
      ]
    },
    exchange_process: {
      text: '換貨申請已建立。商品預計 <span class="highlight">2-3 個工作天</span>內寄出，原商品可透過超商或宅配免費退回。',
      options: [
        { label: '查詢換貨進度', next: 'order_status' },
        { label: '還有其他問題', next: 'main_menu' },
        { label: '不需要協助了', next: 'closing' }
      ]
    },
    resend_item: {
      text: '補寄申請已建立，預計 <span class="highlight">1-2 個工作天</span>內出貨。',
      options: [
        { label: '查詢補寄進度', next: 'order_status' },
        { label: '還有其他問題', next: 'main_menu' },
        { label: '不需要協助了', next: 'closing' }
      ]
    },
    refund_process: {
      text: '退款申請已送出，款項預計 <span class="highlight">3-7 個工作天</span>內退回原付款方式。',
      options: [
        { label: '查詢退款進度', next: 'order_status' },
        { label: '還有其他問題', next: 'main_menu' },
        { label: '不需要協助了', next: 'closing' }
      ]
    },
    order_status: {
      text: '目前進度：<span class="highlight">已受理，客服確認中</span>。預計 24 小時內更新狀態。',
      options: [
        { label: '還有其他問題', next: 'main_menu' },
        { label: '不需要協助了', next: 'closing' }
      ]
    },
    main_menu: {
      text: '請選擇需要協助的項目：',
      options: [
        { label: '顏色/款式送錯', next: 'wrong_item' },
        { label: '品項漏送', next: 'missing_item' },
        { label: '商品損壞', next: 'damaged_item' },
        { label: '不需要協助了', next: 'closing' }
      ]
    },
    closing: {
      text: '服務已結束。如有其他問題，可重新選擇項目繼續。',
      options: [
        { label: '我還有其他問題', next: 'main_menu' }
      ]
    }
  };

  function clearChat() {
    document.getElementById('chatBody').innerHTML = '<div class="date-divider"><span>今天 14:30</span></div>';
  }

  async function chooseOption(label, next) {
    document.querySelectorAll('.qr-btn').forEach(b => { b.disabled = true; });
    appendUserMsg(label);
    await goToStep(next);
  }

  async function goToStep(id) {
    const step = FLOW[id];
    await appendSysMsg(step.text, step.options);
  }

  // ══════════════════════════════
  //  系統訊息：以功能性進度條呈現「處理中」，無擬人化打字或表情動畫
  // ══════════════════════════════
  async function appendSysMsg(text, options) {
    const body = document.getElementById('chatBody');

    const progRow = document.createElement('div');
    progRow.className = 'msg-row sys progress-row';
    progRow.innerHTML = `
      <div class="progress-bubble">
        <div class="progress-label">處理中<span id="pct">0%</span></div>
        <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
      </div>`;
    body.appendChild(progRow);
    body.scrollTop = body.scrollHeight;

    await animateProgress(progRow.querySelector('#pfill'), progRow.querySelector('#pct'));
    progRow.remove();

    const row = document.createElement('div');
    row.className = 'msg-row sys';
    const bubble = document.createElement('div');
    bubble.className = 'bubble sys';
    bubble.innerHTML = text;
    const ts = document.createElement('span');
    ts.className = 'timestamp';
    ts.textContent = nowStr();
    row.appendChild(bubble);
    row.appendChild(ts);

    if (options) {
      const qr = document.createElement('div');
      qr.className = 'quick-replies';
      options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'qr-btn';
        b.textContent = opt.label;
        b.onclick = () => chooseOption(opt.label, opt.next);
        qr.appendChild(b);
      });
      row.appendChild(qr);
    }

    body.appendChild(row);
    body.scrollTop = body.scrollHeight;
  }

  function animateProgress(fillEl, pctEl) {
    return new Promise(resolve => {
      const duration = 1300;
      const start = performance.now();
      function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const pct = Math.round(t * 100);
        fillEl.style.width = pct + '%';
        pctEl.textContent = ' ' + pct + '%';
        if (t < 1) requestAnimationFrame(step);
        else resolve();
      }
      requestAnimationFrame(step);
    });
  }

  function appendUserMsg(text) {
    const body = document.getElementById('chatBody');
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble user';
    bubble.textContent = text;
    const ts = document.createElement('span');
    ts.className = 'timestamp';
    ts.textContent = nowStr();
    row.appendChild(bubble);
    row.appendChild(ts);
    body.appendChild(row);
    body.scrollTop = body.scrollHeight;
  }

  function nowStr() {
    const now = new Date();
    return `${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
  }

  const FALLBACKS = ['已收到您的訊息。', '訊息已記錄，將依序處理。'];
  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    appendUserMsg(text);
    input.value = ''; input.style.height = 'auto';
    const msg = FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
    await appendSysMsg(msg, [ { label: '返回主選單', next: 'main_menu' } ]);
  }

  function handleEnter(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 80) + 'px';
  }

  // 初始化
  clearChat();
  goToStep('start');
</script>
</body>
</html>
