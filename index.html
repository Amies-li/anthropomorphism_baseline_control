<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服系統｜ARIA 頭像與語氣示範</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f2f5;
    --chat-bg: #ffffff;
    --border: #e8eaed;
    --timestamp: #9aa3af;
    --online: #4caf93;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --font-main: 'Noto Sans TC', sans-serif;
    --font-ui: 'DM Sans', sans-serif;

    /* 淡人設 Leona 與強人設 ARIA 共用同一色系（#E473A8），依介面層級調整明暗 */
    --accent: #E473A8;
    --bubble-bg: #F4E6ED;
    --header-bg: #580E31;
    --text-on-bubble: #801949;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-main);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 24px 20px 40px;
    gap: 16px;
  }

  /* ══════════════════════════════
     頂部控制列
  ══════════════════════════════ */
  .top-bar { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 420px; }

  .condition-switcher {
    display: flex; background: #fff; border-radius: 14px; padding: 6px; gap: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); border: 1px solid var(--border); width: 100%;
  }
  .cond-btn {
    flex: 1; font-family: var(--font-ui); font-size: 13.5px; font-weight: 600;
    padding: 11px 16px; border-radius: 10px; border: none; cursor: pointer;
    transition: all 0.25s ease; background: transparent; color: #9aa3af;
    letter-spacing: 0.3px; display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .cond-btn.active-light, .cond-btn.active-strong { background: var(--accent); color: #fff; }

  .cond-desc { font-family: var(--font-ui); font-size: 12px; color: #9aa3af; text-align: center; letter-spacing: 0.3px; line-height: 1.6; padding: 0 6px; }
  .cond-desc span { font-weight: 700; color: var(--accent); }

  /* ══════════════════════════════
     聊天介面外框
  ══════════════════════════════ */
  .chat-wrapper {
    width: 400px; height: 660px; display: flex; flex-direction: column;
    border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    background: var(--chat-bg); position: relative;
  }

  /* ── 人物介紹頁（僅強人設） ── */
  .intro-page {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 32px; text-align: center; gap: 16px;
    background: radial-gradient(circle at 50% 0%, #4a3a38 0%, #201a18 70%);
    color: #fff; opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
  }
  .intro-page.show { opacity: 1; pointer-events: auto; }
  .intro-avatar-wrap { width: 128px; height: 128px; margin-bottom: 4px; filter: drop-shadow(0 10px 24px rgba(185,124,140,0.35)); }
  .intro-name { font-family: var(--font-ui); font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
  .intro-tagline { font-size: 13px; color: #e8c4cf; font-family: var(--font-ui); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  .intro-bio { font-size: 13.5px; line-height: 1.8; color: #ebdcdf; max-width: 280px; }
  .intro-enter-btn {
    margin-top: 12px; font-family: var(--font-ui); font-size: 14px; font-weight: 700;
    padding: 12px 32px; border-radius: 24px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #cf97a5, var(--accent)); color: #fff;
    box-shadow: 0 8px 20px rgba(185,124,140,0.4); transition: transform 0.15s;
  }
  .intro-enter-btn:hover { transform: translateY(-2px) scale(1.03); }

  /* Header */
  .chat-header { padding: 18px 20px 14px; flex-shrink: 0; background: var(--header-bg); }

  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand { font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
  .cond-badge { font-family: var(--font-ui); font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 3px 10px; border-radius: 6px; background: rgba(185,124,140,0.35); color: #f3d9e0; }
  .header-icon { color: rgba(255,255,255,0.4); cursor: pointer; font-size: 16px; }

  .agent-row { display: flex; align-items: center; gap: 12px; }
  .agent-avatar-wrap { position: relative; flex-shrink: 0; width: 48px; height: 48px; }
  .agent-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .avatar-dot { position: absolute; bottom: 1px; right: 1px; width: 12px; height: 12px; background: var(--online); border-radius: 50%; border: 2px solid var(--header-bg); }

  .agent-info { flex: 1; }
  .agent-name { color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .agent-status { color: var(--online); font-size: 12px; margin-top: 2px; }

  .wait-banner { background: rgba(233,69,96,0.1); border-bottom: 1px solid rgba(233,69,96,0.18); padding: 9px 20px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .wait-text { font-size: 12.5px; color: #e94560; font-weight: 500; flex: 1; }
  .wait-timer { font-family: var(--font-ui); font-size: 12px; font-weight: 600; color: #e94560; background: rgba(233,69,96,0.1); padding: 2px 8px; border-radius: 10px; }

  /* Chat body */
  .chat-body { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  .chat-body::-webkit-scrollbar { width: 4px; }
  .chat-body::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 4px; }

  .date-divider { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .date-divider::before, .date-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .date-divider span { font-size: 11px; color: var(--timestamp); font-family: var(--font-ui); }

  .msg-row { display: flex; align-items: flex-end; gap: 8px; animation: fadeUp 0.28s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: visible; position: relative; }
  .msg-avatar.user-av { background: #e8eaed; font-size: 14px; border-radius: 50%; overflow: hidden; }

  .msg-col { display: flex; flex-direction: column; max-width: 74%; gap: 4px; }
  .msg-row.user .msg-col { align-items: flex-end; }

  .bubble { padding: 11px 15px; border-radius: 16px; font-size: 14px; line-height: 1.65; word-break: break-word; border-bottom-left-radius: 4px; background: var(--bubble-bg); color: var(--text-on-bubble); }
  .bubble.user { background: #1a1a2e; color: #fff; border-radius: 18px; border-bottom-right-radius: 4px; }
  .bubble.bot.error { background: #EFE1E4; color: var(--text-on-bubble); border: 1px solid #E2CDD2; }

  .error-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; color: var(--accent); background: rgba(185,124,140,0.15); }

  .highlight { font-weight: 700; color: var(--accent); }

  .timestamp { font-size: 11px; color: var(--timestamp); font-family: var(--font-ui); padding: 0 4px; }
  .sys-msg { text-align: center; font-size: 12px; color: var(--timestamp); font-family: var(--font-ui); padding: 4px 0; }

  /* 打字動畫 */
  .typing-bubble { display: inline-flex; align-items: center; gap: 6px; padding: 12px 16px; border-radius: 16px; border-bottom-left-radius: 4px; min-width: 62px; background: var(--bubble-bg); }
  .typing-bubble .dot { width: 9px; height: 9px; border-radius: 50%; background: #c8a7b0; animation: dotBounce 1.1s ease-in-out infinite; }
  .typing-bubble .dot:nth-child(2) { animation-delay: 0.16s; }
  .typing-bubble .dot:nth-child(3) { animation-delay: 0.32s; }
  @keyframes dotBounce { 0%,60%,100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-6px) scale(1.5); } }
  .typing-label { font-size: 12px; font-family: var(--font-ui); margin-right: 2px; color: var(--accent); font-weight: 600; }

  .typing-cursor { display: inline-block; width: 2px; height: 1em; background: currentColor; border-radius: 2px; vertical-align: text-bottom; margin-left: 1px; animation: cursorBlink 0.55s step-end infinite; }
  @keyframes cursorBlink { 0%,100% { opacity:1; } 50% { opacity:0; } }

  .quick-replies { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .qr-btn { font-family: var(--font-main); font-size: 13px; padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; transition: all 0.18s; font-weight: 500; }
  .qr-btn:hover { background: var(--accent); color: #fff; }
  .qr-btn:disabled { opacity: 0.4; cursor: default; }

  /* Footer */
  .chat-footer { background: #fff; border-top: 1px solid var(--border); padding: 14px 16px; flex-shrink: 0; }
  .input-row { display: flex; align-items: center; gap: 10px; background: #f6f7f9; border-radius: 24px; padding: 8px 8px 8px 16px; border: 1.5px solid transparent; transition: border-color 0.2s; }
  .input-row:focus-within { border-color: #1a1a2e; background: #fff; }
  .chat-input { flex: 1; border: none; background: transparent; font-family: var(--font-main); font-size: 14px; color: #1a1a2e; outline: none; resize: none; height: 24px; line-height: 24px; max-height: 80px; }
  .chat-input::placeholder { color: #adb5bd; }
  .send-btn { width: 36px; height: 36px; border: none; cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; transition: transform 0.15s, background 0.15s; background: var(--accent); }
  .send-btn:hover { transform: scale(1.05); }
  .footer-hint { text-align: center; font-size: 11px; color: #c0c7d0; margin-top: 8px; font-family: var(--font-ui); }

  /* ══════════════════════════════
     頭像：Leona（2D／Mii 風格，扁平、低擬人，待補上傳圖）
  ══════════════════════════════ */
  .av-2d-head { fill: #F6D9BE; }
  .av-2d-hair { fill: #5B4636; }
  .av-2d-eye  { fill: #33424A; }
  .av-2d-mouth{ stroke: #33424A; stroke-width: 2; fill: none; stroke-linecap: round; }

  /* ══════════════════════════════
     頭像：ARIA（真人示範照＋表情疊加）
  ══════════════════════════════ */
  .tilt-loading { animation: tiltwag 1.4s ease-in-out infinite; transform-origin: 50% 85%; }
  @keyframes tiltwag { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
  .shake-bubble { animation: shakeit .5s ease-in-out; }
  @keyframes shakeit { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
  .tear-dot { position: absolute; border-radius: 50%; background: #8FCBE6; animation: teardrop 1.5s ease-in infinite; }
  @keyframes teardrop { 0% { transform: translateY(0); opacity: 1; } 85% { transform: translateY(9px); opacity: 0; } 100% { transform: translateY(9px); opacity: 0; } }
  .pulse-ring { position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: pulsering 1.6s ease-out infinite; pointer-events: none; }
  @keyframes pulsering { 0% { opacity:.55; transform:scale(.85); } 100% { opacity:0; transform:scale(1.3); } }

  .photo-avatar { position: relative; border-radius: 50%; flex-shrink: 0; }
  .photo-avatar-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--accent); }
  .photo-avatar-inner img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; display: block; }
  .expr-badge { position: absolute; bottom: -3px; right: -3px; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }
</style>
</head>
<body class="persona-strong">

<!-- ══ 條件切換 ══ -->
<div class="top-bar">
  <div class="condition-switcher">
    <button class="cond-btn" id="btnLight" onclick="setPersona('light')">2D</button>
    <button class="cond-btn active-strong" id="btnStrong" onclick="setPersona('strong')">3D</button>
  </div>

</div>

<!-- ══ 聊天主體 ══ -->
<div class="chat-wrapper">

  <!-- 人物介紹頁（僅強人設） -->
  <div class="intro-page" id="introPage">
    <div class="intro-avatar-wrap" id="introAvatarWrap"></div>
    <div class="intro-name">ARIA</div>
    <div class="intro-tagline">你的專屬客服夥伴</div>
    <div class="intro-bio">個性開朗、有點小龜毛地在意每位顧客的心情。我的工作是幫你搞定訂單、物流和帳戶相關的大小事，今天也會盡力陪你把問題解決！</div>
    <button class="intro-enter-btn" onclick="enterChat()">開始對話</button>
  </div>

  <!-- Header -->
  <div class="chat-header" id="chatHeader">
    <div class="header-top">
      <span class="brand">Support Chat</span>
      <span class="header-icon">✕</span>
    </div>
    <div class="agent-row">
      <div class="agent-avatar-wrap">
        <div class="agent-avatar" id="agentAvatar"></div>
        <div class="avatar-dot"></div>
      </div>
      <div class="agent-info">
        <div class="agent-name" id="agentName">ARIA</div>
        <div class="agent-status" id="agentStatus">● 線上，隨時待命</div>
      </div>
    </div>
  </div>

  <!-- Wait banner -->
  <div class="wait-banner" id="waitBanner" style="display:none;">
    <span>⏳</span>
    <span class="wait-text">目前等待人工客服中</span>
    <span class="wait-timer" id="timer">00:00</span>
  </div>

  <!-- Chat body（訊息由 JS 依人設層級動態產生，確保兩邊語意相同、僅語氣不同） -->
  <div class="chat-body" id="chatBody"></div>

  <!-- Footer -->
  <div class="chat-footer">
    <div class="input-row">
      <textarea class="chat-input" id="chatInput" placeholder="輸入訊息…" rows="1"
        onkeydown="handleEnter(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMessage()">&#10148;</button>
    </div>
    <div class="footer-hint" id="footerHint">回覆將由 ARIA 親自為您處理</div>
  </div>
</div>

  // 共用色彩（暖膚色／棕髮），兩種人設僅在「呈現細緻度」與「表情動態」上不同
  const SKIN = '#F6DDC4', SKIN_HI = '#FFF0DE', SKIN_SHADOW = '#E8C4A0';
  const HAIR = '#5B4638', HAIR_HI = '#7A5C48', HAIR_DARK = '#3B2C22';

  function leonaAvatar(state, size) {
    // 低擬人：扁平色塊、簡化五官，狀態間差異刻意壓低（克制）
    let mouth = '<path class="av-2d-mouth" d="M18 27 Q22 29 26 27"/>';
    let eyes  = '<circle class="av-2d-eye" cx="17" cy="21" r="1.8"/><circle class="av-2d-eye" cx="27" cy="21" r="1.8"/>';
    if (state === 'loading') {
      eyes = '<line x1="14.5" y1="21" x2="19.5" y2="21" stroke="#4A3A2E" stroke-width="1.8" stroke-linecap="round"/><line x1="24.5" y1="21" x2="29.5" y2="21" stroke="#4A3A2E" stroke-width="1.8" stroke-linecap="round"/>';
    } else if (state === 'error') {
      mouth = '<path class="av-2d-mouth" d="M18 28 Q22 26.5 26 28"/>'; // 些微下垂，但不誇張
    }
    return `<svg viewBox="0 0 44 50" width="${size}" height="${size}">
      <path d="M4 50 Q4 33 22 33 Q40 33 40 50 Z" fill="var(--accent)"/>
      <rect x="16" y="29" width="12" height="9" fill="var(--accent)"/>
      <circle cx="22" cy="22" r="14" fill="${SKIN}"/>
      <path d="M8 18 Q9 4 22 4 Q35 4 36 18 Q29 10 22 11 Q15 10 8 18 Z" fill="${HAIR}"/>
      <path d="M9 20 Q6 30 9 39 Q13 35 12 23 Z" fill="${HAIR}"/>
      ${eyes}${mouth}
    </svg>`;
  }

  // 強人設：使用真人示範照作為頭像本體，依對話狀態疊加表情標記與動態效果
  // （照片本身無法變形五官，因此用角標表情、抖動／歪頭動畫、淚滴疊加來傳達情緒）
  function ariaAvatar(state, size) {
    let wrapClass = '', overlay = '';
    const badgeSize = Math.max(12, Math.round(size * 0.34));
    if (state === 'loading') {
      wrapClass = 'tilt-loading';
      overlay = `<span class="expr-badge" style="font-size:${badgeSize}px">💭</span>`;
    } else if (state === 'error') {
      wrapClass = 'shake-bubble';
      overlay = `<span class="expr-badge" style="font-size:${badgeSize}px">😢</span>
                 <span class="tear-dot" style="width:${size*0.13}px;height:${size*0.17}px;left:33%;top:46%"></span>
                 <span class="tear-dot" style="width:${size*0.13}px;height:${size*0.17}px;left:60%;top:44%;animation-delay:.35s"></span>`;
    }
    return `<div class="photo-avatar ${wrapClass}" style="width:${size}px;height:${size}px;">
        <div class="photo-avatar-inner"><img src="${ARIA_PHOTO}" alt="ARIA"></div>
        ${overlay}
      </div>`;
  }

  function renderAvatar(el, state, size) {
    el.innerHTML = currentPersona === 'light' ? leonaAvatar(state, size) : ariaAvatar(state, size);
  }

        { label: '還有其他問題', next: 'main_menu' },
        { label: '不需要協助了', next: 'closing' }
      ]
    },
    refund_process: {
      text: {
        light: '了解，退款申請已經送出，款項將於 3-7 個工作天內退回原付款方式，會再通知您最新進度。',
        strong: '了解，退款申請我已經送出去了，款項大概 3-7 個工作天會退回原本付款的方式，有進度我會再跟你說！'
      },
      options: [
        { label: '查詢退款進度', next: 'order_status' },
        { label: '還有其他問題', next: 'main_menu' },
        { label: '不需要協助了', next: 'closing' }
      ]
    },
    order_status: {
      text: {
        light: '目前處理進度為【已受理，客服確認中】，預計 24 小時內會有專人與您聯繫後續安排。',
        strong: '目前進度是【已受理，客服確認中】，大概 24 小時內就會有專人聯絡你安排後續囉！'
      },
      options: [
        { label: '還有其他問題', next: 'main_menu' },
        { label: '不需要協助了', next: 'closing' }
      ]
    },
    main_menu: {
      text: {
        light: '沒問題，請問還有什麼我可以協助的呢？',
        strong: '沒問題！還有什麼我可以幫你的嗎？'
      },
      options: [
        { label: '顏色/款式送錯', next: 'wrong_item' },
        { label: '品項漏送', next: 'missing_item' },
        { label: '商品損壞', next: 'damaged_item' },
        { label: '不需要協助了', next: 'closing' }
      ]
    },
    closing: {
      text: {
        light: '好的，謝謝您的耐心與體諒，若後續還有任何狀況，隨時歡迎回來找我協助喔！',
        strong: '好的，謝謝你的耐心跟體諒！之後有任何狀況都歡迎再來找我聊聊喔！'
      },
      options: [
        { label: '我還有其他問題', next: 'main_menu' }
      ]
    }
  };

  // ══════════════════════════════
  //  切換人設層級
  // ══════════════════════════════
  function setPersona(p) {
    currentPersona = p;
    document.body.className = 'persona-' + p;
    const d = PERSONA[p];

    document.getElementById('agentName').textContent   = d.name;
    document.getElementById('agentStatus').textContent = d.status;
    document.getElementById('footerHint').textContent  = d.footerHint;
    renderAvatar(document.getElementById('agentAvatar'), 'idle', 48);

    const header = document.getElementById('chatHeader');
    header.className = 'chat-header';

    document.getElementById('btnLight').className  = `cond-btn ${p === 'light'  ? 'active-light'  : ''}`;
    document.getElementById('btnStrong').className = `cond-btn ${p === 'strong' ? 'active-strong' : ''}`;

    const intro = document.getElementById('introPage');
    if (p === 'strong') {
      renderAvatar(document.getElementById('introAvatarWrap'), 'idle', 128);
      intro.classList.add('show');
    } else {
      intro.classList.remove('show');
    }

    resetConversation();
  }

  function enterChat() {
    document.getElementById('introPage').classList.remove('show');
  }

  // ══════════════════════════════
  //  對話流程引擎（依 FLOW 節點跳轉，兩人設共用同一套劇本）
  // ══════════════════════════════
  function clearChat() {
    document.getElementById('chatBody').innerHTML = '<div class="date-divider"><span>今天 14:30</span></div>';
  }

  async function resetConversation() {
    stopTimer();
    document.getElementById('waitBanner').style.display = 'none';
    clearChat();
    await goToStep('start');
  }

  async function chooseOption(label, next) {
    document.querySelectorAll('.qr-btn').forEach(b => { b.disabled = true; });
    appendUserMsg(label);
    await goToStep(next);
  }

  async function goToStep(id) {
    const step = FLOW[id];
    const text = step.text[currentPersona];

    const opts = {};
    if (step.isError) { opts.isError = true; opts.errorTag = step.tag[currentPersona]; }
    if (step.options) opts.options = step.options;

    await appendBotMsg(text, opts);
  }

  // ══════════════════════════════
  //  動態訊息（打字動畫、選項按鈕、輸入送出）
  // ══════════════════════════════
  async function appendBotMsg(text, opts = {}) {
    const body = document.getElementById('chatBody');
    const typingRow = createTypingRow();
    body.appendChild(typingRow);
    body.scrollTop = body.scrollHeight;
    await sleep(2100);
    typingRow.remove();

    const { row, bubble, col } = createBotRow(opts.isError);
    body.appendChild(row);
    body.scrollTop = body.scrollHeight;

    if (opts.isError) {
      bubble.innerHTML = `<div class="error-tag">${opts.errorTag}</div>`;
      if (currentPersona === 'strong') bubble.classList.add('shake-bubble');
    }
    await typeText(bubble, text, 45);

    if (opts.options) {
      const qr = document.createElement('div');
      qr.className = 'quick-replies';
      opts.options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'qr-btn';
        b.textContent = opt.label;
        b.onclick = () => chooseOption(opt.label, opt.next);
        qr.appendChild(b);
      });
      col.appendChild(qr);
    }
    body.scrollTop = body.scrollHeight;
  }

  function createTypingRow() {
    const row = document.createElement('div');
    row.className = 'msg-row';
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    renderAvatar(av, 'loading', 32);
    if (currentPersona === 'light') {
      const ring = document.createElement('span');
      ring.className = 'pulse-ring';
      av.appendChild(ring);
    }
    const col = document.createElement('div');
    col.className = 'msg-col';
    const tb = document.createElement('div');
    tb.className = 'typing-bubble';
    tb.innerHTML = `<span class="typing-label">${PERSONA[currentPersona].typingLabel}</span><div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
    col.appendChild(tb);
    row.appendChild(av);
    row.appendChild(col);
    return row;
  }

  function createBotRow(isError) {
    const row = document.createElement('div');
    row.className = 'msg-row';
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    renderAvatar(av, isError ? 'error' : 'idle', 32);
    const col = document.createElement('div');
    col.className = 'msg-col';
    const bubble = document.createElement('div');
    bubble.className = isError ? 'bubble bot error' : 'bubble bot';
    const now = new Date();
    const ts = document.createElement('span');
    ts.className = 'timestamp';
    ts.textContent = `${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
    col.appendChild(bubble);
    col.appendChild(ts);
    row.appendChild(av);
    row.appendChild(col);
    return { row, bubble, col };
  }

  function appendUserMsg(text) {
    const body = document.getElementById('chatBody');
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const av = document.createElement('div');
    av.className = 'msg-avatar user-av'; av.textContent = '🙂';
    const col = document.createElement('div'); col.className = 'msg-col';
    const bubble = document.createElement('div');
    bubble.className = 'bubble user'; bubble.textContent = text;
    const now = new Date();
    const ts = document.createElement('span');
    ts.className = 'timestamp';
    ts.textContent = `${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
    col.appendChild(bubble); col.appendChild(ts);
    row.appendChild(av); row.appendChild(col);
    body.appendChild(row);
    body.scrollTop = body.scrollHeight;
  }

  function typeText(bubble, text, delay) {
    return new Promise(resolve => {
      const cursor = document.createElement('span');
      cursor.className = 'typing-cursor';
      bubble.appendChild(cursor);
      let i = 0;
      const iv = setInterval(() => {
        if (i < text.length) {
          cursor.before(document.createTextNode(text[i++]));
          document.getElementById('chatBody').scrollTop = 99999;
        } else {
          clearInterval(iv); cursor.remove(); resolve();
        }
      }, delay);
    });
  }

  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    appendUserMsg(text);
    input.value = ''; input.style.height = 'auto';
    const fb = PERSONA[currentPersona].fallbacks;
    const msg = fb[Math.floor(Math.random() * fb.length)];
    await appendBotMsg(msg, { options: [ { label: '返回主選單', next: 'main_menu' } ] });
  }

  function handleEnter(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 80) + 'px';
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // 等待計時器
  let timerInterval = null, secs = 0;
  function showWaitBanner() {
    document.getElementById('waitBanner').style.display = 'flex';
    secs = 0;
    document.getElementById('timer').textContent = '00:00';
    timerInterval = setInterval(() => {
      secs++;
      document.getElementById('timer').textContent =
        `${Math.floor(secs/60).toString().padStart(2,'0')}:${(secs%60).toString().padStart(2,'0')}`;
    }, 1000);
  }
  function stopTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = null; }

  // 初始化
  setPersona('strong');
</script>
</body>
</html>
